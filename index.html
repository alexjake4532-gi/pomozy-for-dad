        const AudioEngine = {
            ctx: null,
            intervalId: null,
            isPlaying: false,
            activeNodes: [],
            
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            start(soundId) {
                this.stop();
                this.init();
                if (!this.ctx) return;
                this.isPlaying = true;
                this.activeNodes = [];
                const now = this.ctx.currentTime;

                if (soundId === 'zen') {
                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc1.type = 'sine';
                    osc1.frequency.value = 432;
                    osc2.type = 'sine';
                    osc2.frequency.value = 435;

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 1.2);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    this.activeNodes.push({ osc1, osc2, gain });
                    return;
                }

                const playPattern = () => {
                    if (!this.isPlaying) return;
                    const cTime = this.ctx.currentTime;
                    
                    if (soundId === 'cozy') {
                        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            const startTime = cTime + (i * 0.16);
                            gain.gain.setValueAtTime(0, startTime);
                            gain.gain.linearRampToValueAtTime(0.25, startTime + 0.08);
                            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 2.2);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(startTime);
                            osc.stop(startTime + 2.2);
                        });
                    } else if (soundId === 'digital') {
                        [0, 0.14, 0.28].forEach(offset => {
                            const startTime = cTime + offset;
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.value = 880;
                            gain.gain.setValueAtTime(0, startTime);
                            gain.gain.setValueAtTime(0.08, startTime + 0.01);
                            gain.gain.setValueAtTime(0.08, startTime + 0.09);
                            gain.gain.setValueAtTime(0, startTime + 0.1);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(startTime);
                            osc.stop(startTime + 0.12);
                        });
                    }
                };
                
                playPattern();
                const intervalTime = soundId === 'digital' ? 950 : 2800;
                this.intervalId = setInterval(playPattern, intervalTime);
            },

            stop() {
                this.isPlaying = false;
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                
                if (this.activeNodes.length > 0 && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.activeNodes.forEach(({ osc1, osc2, gain }) => {
                        try {
                            gain.gain.cancelScheduledValues(now);
                            gain.gain.setValueAtTime(gain.gain.value, now);
                            gain.gain.linearRampToValueAtTime(0.0001, now + 0.6);
                            setTimeout(() => {
                                try { osc1.stop(); osc2.stop(); } catch (e) {}
                            }, 650);
                        } catch (e) {}
                    });
                    this.activeNodes = [];
                }
            }
        };

        const LivelyAuroraBackground = ({ theme, isActive }) => {
            const [mousePos, setMousePos] = useState({ x: 50, y: 50 });
            
            const particles = useMemo(() => 
                Array.from({ length: 16 }, (_, i) => ({
                    id: i,
                    left: `${(i * 6.3 + 4) % 94}%`,
                    top: `${(i * 12 + 8) % 88}%`,
                    size: 3 + (i % 3) * 2,
                    duration: 14 + (i % 4) * 4,
                    delay: -(i * 1.5),
                    opacity: theme.isDark ? (0.4 + (i % 3) * 0.2) : (0.28 + (i % 3) * 0.15)
                })), [theme.isDark]
            );

            useEffect(() => {
                let rafId = null;
                const handleMouseMove = (e) => {
                    if (rafId) return;
                    rafId = requestAnimationFrame(() => {
                        setMousePos({
                            x: Math.round((e.clientX / window.innerWidth) * 100),
                            y: Math.round((e.clientY / window.innerHeight) * 100)
                        });
                        rafId = null;
                    });
                };
                window.addEventListener('mousemove', handleMouseMove, { passive: true });
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    if (rafId) cancelAnimationFrame(rafId);
                };
            }, []);

            return (

            const [alarmSound, setAlarmSound] = useState(() => {

            const [durations, setDurations] = useState({ pomodoro: 25, shortBreak: 5, longBreak: 15 });
            const [timeLeft, setTimeLeft] = useState(durations.pomodoro * 60);
            
            const [isEditing, setIsEditing] = useState(false);
            const [editHours, setEditHours] = useState('');
            const [editMins, setEditMins] = useState('');
            const hoursInputRef = useRef(null);

            const theme = THEMES[activeThemeId] || THEMES.peach;
            const currentModeInfo = MODES_CONFIG[activeMode] || MODES_CONFIG.pomodoro;
            const currentTotalSeconds = durations[activeMode] * 60;

            const handleCardMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const midX = rect.width / 2;
                const midY = rect.height / 2;
                const rx = ((y - midY) / midY) * -5;
                const ry = ((x - midX) / midX) * 5;
                setCardTilt({ rx, ry });
            };

            const handleCardMouseLeave = () => {
                setCardTilt({ rx: 0, ry: 0 });
            };

            const triggerConfetti = () => {
                const colors = [theme.primary, theme.glow1, theme.glow2, '#FFD166', '#06D6A0', '#118AB2'];
                const pieces = Array.from({ length: 32 }, (_, i) => {
                    const angle = (Math.PI * 2 * i) / 32 + (Math.random() - 0.5);
                    const dist = 90 + Math.random() * 120;
                    return {
                        id: `${Date.now()}-${i}`,
                        cx: `${Math.cos(angle) * dist}px`,
                        cy: `${Math.sin(angle) * dist}px`,
                        color: colors[i % colors.length],
                        crot: `${(Math.random() - 0.5) * 720}deg`,
                        size: 6 + Math.random() * 7,
                        isRound: i % 2 === 0
                    };
                });
                setConfettiBurst(pieces);
                setTimeout(() => setConfettiBurst([]), 2500);
            };

            useEffect(() => { 
                try { localStorage.setItem('cozyPomodoroSessions', JSON.stringify(sessions)); } catch(e) {}
            }, [sessions]);

            useEffect(() => { 
                try { localStorage.setItem('cozyPomodoroAlarm', alarmSound); } catch(e) {}
            }, [alarmSound]);

            useEffect(() => {
                return () => AudioEngine.stop();
            }, []);

            const switchMode = useCallback((modeId) => {
                setActiveMode(modeId);
                setIsActive(false);
                setIsRinging(false);
                AudioEngine.stop();
                setTimeLeft(durations[modeId] * 60);
                setIsEditing(false);
            }, [durations]);

            const triggerAlarm = useCallback(() => {
                setIsActive(false);
                setIsRinging(true);
                AudioEngine.start(alarmSound);
                triggerConfetti();
            }, [alarmSound, theme]);

            const handleStopAlarm = () => {
                AudioEngine.stop();
                setIsRinging(false);
                
                const newSession = { 
                    id: Date.now().toString(), 
                    modeId: activeMode, 
                    duration: durations[activeMode], 
                    timestamp: Date.now() 
                };
                setSessions(prev => [newSession, ...prev]);
                
                if (activeMode === 'pomodoro') {
                    const newCycleCount = cycleCount + 1;
                    if (newCycleCount >= 4) {
                        setCycleCount(4); 
                        switchMode('longBreak');
                    } else {
                        setCycleCount(newCycleCount);
                        switchMode('shortBreak');
                    }
                } else if (activeMode === 'longBreak') {
                    setCycleCount(0);
                    switchMode('pomodoro');
                } else if (activeMode === 'shortBreak') {
                    switchMode('pomodoro');
                }
            };

            const clearStats = () => {
                setSessions([]);
                setShowClearConfirm(false);
            };

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft((t) => t - 1), 1000);
                } else if (isActive && timeLeft === 0) {
                    triggerAlarm();

                return () => clearInterval(interval);
            }, [isActive, timeLeft, triggerAlarm]);

            useEffect(() => {
                if (isRinging) {
                    document.title = `🔔 TIME'S UP - ${currentModeInfo.name}`;
                } else if (!isEditing && currentView === 'timer') {
                    const h = Math.floor(timeLeft / 3600);
                    const m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                    const s = (timeLeft % 60).toString().padStart(2, '0');
                    const timeString = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
                    document.title = isActive ? `${timeString} • ${currentModeInfo.name}` : 'Pomozy';
                } else {
                    document.title = 'Pomozy - Cozy Focus Timer';

            const toggleTimer = () => {
                if (isEditing) handleEditSubmit();

            const resetTimer = () => {
                setIsActive(false);
                setIsEditing(false);
                setTimeLeft(durations[activeMode] * 60);

                setIsActive(false);
                const currentMins = durations[activeMode];
                setEditHours(Math.floor(currentMins / 60).toString());
                setEditMins((currentMins % 60).toString());

                setTimeout(() => hoursInputRef.current?.focus(), 50);

            const handleEditSubmit = () => {
                let h = parseInt(editHours, 10);
                let m = parseInt(editMins, 10);
                if (isNaN(h)) h = 0; 
                if (isNaN(m)) m = 0;
                let totalNewMins = (h * 60) + m;
                if (totalNewMins < 1) totalNewMins = 1; 
                if (totalNewMins > 600) totalNewMins = 600; 
                const newDurations = { ...durations, [activeMode]: totalNewMins };

                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;

                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const formatStatsDate = (timestamp) => {
                return new Date(timestamp).toLocaleDateString(undefined, {

            const ringCircumference = 2 * Math.PI * ringRadius;

            const strokeDashoffset = isRinging ? 0 : Math.max(0, Math.min(ringCircumference, progress * ringCircumference));
            
            const angle = progress * 2 * Math.PI - Math.PI / 2;

            const totalFocusHours = Math.floor(totalFocusMinutes / 60);

                        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--theme-text-light); border-radius: 10px; opacity: 0.4; }

                    <LivelyAuroraBackground theme={theme} isActive={isActive} />

                                                                    value={editMins} 
                                                                    onChange={(e) => setEditMins(e.target.value)} 
                                                                    className="w-16 sm:w-20 text-center bg-transparent outline-none text-4xl sm:text-5xl font-black tracking-tighter tabular-nums leading-none border-b-2 border-dashed" 
                                                                    style={{ borderColor: theme.primary, color: theme.textDark }} 
                                                                    placeholder="0" 
                                                                />
                                                                <span className="text-lg font-bold ml-1 opacity-50">m</span>
                                                            </div>
                                                        </div>
                                                        <button 
                                                            onClick={handleEditSubmit} 
                                                            className="flex items-center gap-2 px-5 py-2 rounded-full text-white font-bold text-xs sm:text-sm shadow-md hover:scale-105 active:scale-95 transition-transform" 
                                                            style={{ backgroundColor: theme.primary }}
                                                        >
                                                            <Icon name="save" size={15} /> Save
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={handleTimeClick} 
                                                        title="Click to edit duration"
                                                        className={`font-black tracking-tighter tabular-nums leading-none cursor-pointer focus:outline-none rounded-2xl hover:bg-black/5 px-4 py-2 transition-transform hover:scale-110 active:scale-95 pointer-events-auto ${timeLeft >= 3600 ? 'text-5xl sm:text-6xl' : 'text-6xl sm:text-7xl'} ${isActive ? 'animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]' : ''}`}
                                                    >
                                                        {formatTimeDisplay(timeLeft)}
                                                    </button>
                                                )}
                                                
                                                {!isEditing && !isRinging && (
                                                    <div className="mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest opacity-60 flex items-center gap-1.5">
                                                        <Icon name={currentModeInfo.icon} size={14} className={isActive ? 'animate-bounce' : ''} />
                                                        {currentModeInfo.name}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Controls with Audio Visualizer */}
                                        <div className={`flex items-center justify-center space-x-6 w-full mb-4 transition-opacity ${isRinging ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                                            <div className="w-12 sm:w-14 flex items-center justify-center">
                                                {isActive && (
                                                    <div className="flex items-end gap-1 h-6">
                                                        <div className="w-1 bg-current rounded-full animate-eq-1 opacity-60" style={{ color: theme.primary }} />
                                                        <div className="w-1 bg-current rounded-full animate-eq-2 opacity-60" style={{ color: theme.primary }} />
                                                        <div className="w-1 bg-current rounded-full animate-eq-3 opacity-60" style={{ color: theme.primary }} />
                                                    </div>
                                                )}
                                            </div>
                                            <button 
                                                onClick={toggleTimer} 
                                                className="group relative flex items-center justify-center w-20 h-20 sm:w-22 sm:h-22 rounded-full shadow-lg hover:scale-110 active:scale-90 transition-all duration-300 focus:outline-none" 
                                                style={{ 
                                                    backgroundColor: theme.primary, 
                                                    color: '#FFFFFF', 
                                                    boxShadow: `0 14px 32px -4px ${theme.shadow}` 
                                                }}
                                            >
                                                {isActive && (
                                                    <div 
                                                        className="absolute -inset-1 rounded-full animate-ping opacity-25 pointer-events-none"
                                                        style={{ backgroundColor: theme.primary }}
                                                    />
                                                )}
                                                {isActive ? (
                                                    <Icon name="pause" fill="currentColor" size={32} />
                                                ) : (
                                                    <Icon name="play" fill="currentColor" size={32} className="ml-1" />
                                                )}
                                            </button>
                                            <button 
                                                onClick={resetTimer} 
                                                title="Reset current timer"
                                                className="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full hover:scale-110 active:scale-90 transition-all duration-300 focus:outline-none text-current opacity-70 hover:opacity-100"
                                                style={{ backgroundColor: theme.pillBg }}
                                            >
                                                <Icon name="rotateCcw" size={20} strokeWidth={2.5} />
                                            </button>
                                        </div>

                                        {/* Status Subtitle */}
                                        <div className="h-6 flex items-center" style={{ color: theme.textLight }}>
                                            <p className="font-bold text-xs sm:text-sm tracking-wider uppercase opacity-80 flex items-center gap-1.5">
                                                {isActive && <Icon name="sparkles" size={14} className="animate-spin text-amber-500" />}
                                                {isEditing ? "Set custom minutes" : isRinging ? "Time's up!" : (isActive ? (activeMode === 'pomodoro' ? "Deep focus in progress..." : "Recharging...") : "Ready when you are")}
                                                {isActive && <Icon name="sparkles" size={14} className="animate-spin text-amber-500" />}
                                            </p>
                                        </div>
                                    </div>
                                )}

                                {}
                                {currentView === 'stats' && (
                                    <div className="flex flex-col items-center w-full h-full">
                                        <div 
                                            className="w-full p-6 rounded-[2rem] mb-6 flex flex-col items-center justify-center text-center cozy-shadow-inner" 
                                            style={{ backgroundColor: theme.ringBg }}
                                        >
                                            <span className="text-xs sm:text-sm font-bold uppercase tracking-widest mb-1 opacity-70">Total Focus Time</span>
                                            <div className="text-3xl sm:text-4xl font-black tracking-tight" style={{ color: theme.primary }}>
                                                {totalFocusHours > 0 && <span>{totalFocusHours}<span className="text-lg opacity-70 ml-1 mr-2">h</span></span>}
                                                <span>{remainingFocusMins}<span className="text-lg opacity-70 ml-1">m</span></span>
                                            </div>
                                        </div>

                                        <div className="w-full flex justify-between items-end mb-3 px-2">
                                            <h3 className="font-bold text-base sm:text-lg">Recent Sessions</h3>
                                            {sessions.length > 0 && !showClearConfirm && (
                                                <button 
                                                    onClick={() => setShowClearConfirm(true)} 
                                                    className="text-xs sm:text-sm opacity-50 hover:opacity-100 transition-opacity flex items-center gap-1"
                                                >
                                                    <Icon name="trash2" size={14} /> Clear History
                                                </button>
                                            )}
                                            {showClearConfirm && (
                                                <div className="flex items-center gap-2 text-xs sm:text-sm">
                                                    <span className="opacity-70">Are you sure?</span>
                                                    <button onClick={clearStats} className="font-bold text-red-500 hover:text-red-600 transition-colors">Yes</button>
                                                    <button onClick={() => setShowClearConfirm(false)} className="font-bold opacity-50 hover:opacity-100 transition-opacity">No</button>
                                                </div>
                                            )}
                                        </div>

                                        <div className="w-full flex-1 min-h-[240px] max-h-[280px] overflow-y-auto custom-scrollbar pr-2 pb-4 space-y-2.5">
                                            {sessions.length === 0 ? (
                                                <div className="w-full h-full flex flex-col items-center justify-center opacity-40 mt-8">
                                                    <Icon name="calendar" size={40} className="mb-3" />
                                                    <p className="font-bold text-center text-sm">No sessions recorded yet.<br/>Start your first pomodoro timer!</p>
                                                </div>
                                            ) : (
                                                sessions.map((session) => {
                                                    const mode = MODES_CONFIG[session.modeId] || MODES_CONFIG.pomodoro;
                                                    const sessH = Math.floor(session.duration / 60);
                                                    const sessM = session.duration % 60;
                                                    const durationStr = sessH > 0 ? `${sessH}h ${sessM > 0 ? sessM + 'm' : ''}` : `${sessM}m`;

                                                    return (
                                                        <div 
                                                            key={session.id} 
                                                            className="w-full flex items-center justify-between p-3.5 rounded-2xl transition-colors"
                                                            style={{ backgroundColor: theme.itemBg }}
                                                        >
                                                            <div className="flex items-center gap-3">
                                                                <div 
                                                                    className="p-2 rounded-full shadow-xs" 
                                                                    style={{ 
                                                                        backgroundColor: theme.isDark ? 'rgba(255,255,255,0.1)' : '#FFFFFF', 
                                                                        color: theme.primary 
                                                                    }}
                                                                >
                                                                    <Icon name={mode.icon} size={16} strokeWidth={2.5} />
                                                                </div>
                                                                <div className="flex flex-col">
                                                                    <span className="font-bold text-sm">{mode.name}</span>
                                                                    <span className="text-xs opacity-60 font-semibold">{formatStatsDate(session.timestamp)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="font-black text-sm">{durationStr}</div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                )}

                                {}
                                {currentView === 'settings' && (
                                    <div className="flex flex-col items-start w-full h-full">
                                        <div className="w-full mb-6">
                                            <h3 className="font-bold text-base sm:text-lg mb-3 px-2">Alarm Sound</h3>
                                            <div className="w-full flex flex-col gap-2.5">
                                                {ALARM_TYPES.map(alarm => (
                                                    <div 
                                                        key={alarm.id}
                                                        onClick={() => { setAlarmSound(alarm.id); if(previewId) togglePreview(alarm.id); }}
                                                        className="w-full flex items-center justify-between p-3.5 rounded-2xl border-2 transition-all cursor-pointer"
                                                        style={{ 
                                                            borderColor: alarmSound === alarm.id ? theme.primary : 'transparent',
                                                            backgroundColor: alarmSound === alarm.id ? theme.activePillBg : theme.itemBg
                                                        }}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <div 
                                                                className="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                                                                style={{ borderColor: theme.primary, backgroundColor: alarmSound === alarm.id ? theme.primary : 'transparent' }}
                                                            >
                                                                {alarmSound === alarm.id && <div className="w-2 h-2 bg-white rounded-full" />}
                                                            </div>
                                                            <div className="flex flex-col">
                                                                <span className="font-bold text-sm sm:text-base">{alarm.name}</span>
                                                                <span className="text-xs opacity-60 font-semibold">{alarm.desc}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); togglePreview(alarm.id); }}
                                                            className="p-2 rounded-full flex items-center justify-center transition-transform hover:scale-110 active:scale-95 shadow-xs"
                                                            style={{ 
                                                                backgroundColor: previewId === alarm.id ? theme.primary : (theme.isDark ? 'rgba(255,255,255,0.14)' : '#FFFFFF'), 
                                                                color: previewId === alarm.id ? '#FFFFFF' : theme.primary 
                                                            }}
                                                            title="Preview alarm sound"
                                                        >
                                                            {previewId === alarm.id ? <Icon name="stopSquare" fill="currentColor" size={14} /> : <Icon name="play" fill="currentColor" size={14} className="ml-0.5" />}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div 
                                            className="w-full mt-auto p-4 rounded-2xl flex items-center gap-3.5"
                                            style={{ backgroundColor: theme.itemBg }}
                                        >
                                            <div 
                                                className="p-2.5 rounded-full shadow-xs" 
                                                style={{ 
                                                    backgroundColor: theme.isDark ? 'rgba(255,255,255,0.1)' : '#FFFFFF', 
                                                    color: theme.primary 
                                                }}
                                            >
                                                <Icon name="bell" size={20} />
                                            </div>
                                            <p className="text-xs sm:text-sm font-semibold opacity-70 leading-snug">
                                                Alarms ring continuously until stopped. Click the play button to preview.
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {}
                            <div 
                                className="w-full mt-auto pt-6 flex flex-col items-center gap-3"
                                style={{ borderTop: `2px solid ${theme.borderSubtle}` }}
                            >
                                {/* Theme Picker with 3 Light & 3 Dark groups */}
                                {currentView === 'timer' && (
                                    <div 
                                        className="flex items-center gap-1.5 p-1.5 rounded-full cozy-shadow-inner mb-1"
                                        style={{ backgroundColor: theme.pillBg }}
                                    >
                                        {/* Sun Indicator for 3 Light Themes */}
                                        <div className="pl-1 pr-0.5 opacity-60 flex items-center" title="Light Themes">
                                            <Icon name="sun" size={14} />
                                        </div>
                                        {lightThemes.map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => setActiveThemeId(t.id)}
                                                className="w-7 h-7 rounded-full flex items-center justify-center transition-all duration-300 hover:scale-115 active:scale-90 shadow-xs"
                                                style={{ backgroundColor: t.primary }}
                                                title={`Switch to ${t.name} (Light)`}
                                            >
                                                {activeThemeId === t.id && <Icon name="check" size={13} className="text-white" strokeWidth={3} />}
                                            </button>
                                        ))}

                                        {/* Divider */}
                                        <div 
                                            className="w-[1px] h-4 mx-1 opacity-25" 
                                            style={{ backgroundColor: theme.textDark }} 
                                        />

                                        {/* Moon Indicator for 3 Dark Themes */}
                                        <div className="pl-0.5 pr-0.5 opacity-60 flex items-center" title="Dark Themes">
                                            <Icon name="moon" size={13} />
                                        </div>
                                        {darkThemes.map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => setActiveThemeId(t.id)}
                                                className="w-7 h-7 rounded-full flex items-center justify-center transition-all duration-300 hover:scale-115 active:scale-90 shadow-xs"
                                                style={{ backgroundColor: t.primary }}
                                                title={`Switch to ${t.name} (Dark)`}
                                            >
                                                {activeThemeId === t.id && <Icon name="check" size={13} className="text-white" strokeWidth={3} />}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Main Tab Navigation */}
                                <div 
                                    className="flex rounded-full p-1 w-full max-w-[260px] justify-between relative cozy-shadow-inner"
                                    style={{ backgroundColor: theme.pillBg }}
                                >
                                    <div 
                                        className="absolute inset-y-1 w-[calc(33.33%-2px)] rounded-full transition-all duration-300 shadow-sm" 
                                        style={{ 
                                            backgroundColor: theme.activePillBg,
                                            left: currentView === 'timer' ? '3px' : currentView === 'stats' ? 'calc(33.33% + 1px)' : 'calc(66.66% - 1px)' 
                                        }} 
                                    />
                                    
                                    <button 
                                        onClick={() => handleViewChange('timer')} 
                                        className={`relative z-10 w-1/3 py-2 flex justify-center items-center font-bold text-sm transition-colors duration-300 ${currentView === 'timer' ? '' : 'opacity-50 hover:opacity-100'}`} 
                                        style={{ color: currentView === 'timer' ? theme.primary : theme.textDark }} 
                                        title="Timer"
                                    >
                                        <Icon name="timerIcon" size={18} />
                                    </button>
                                    <button 
                                        onClick={() => handleViewChange('stats')} 
                                        className={`relative z-10 w-1/3 py-2 flex justify-center items-center font-bold text-sm transition-colors duration-300 ${currentView === 'stats' ? '' : 'opacity-50 hover:opacity-100'}`} 
                                        style={{ color: currentView === 'stats' ? theme.primary : theme.textDark }} 
                                        title="Statistics"
                                    >
                                        <Icon name="barChart2" size={18} />
                                    </button>
                                    <button 
                                        onClick={() => handleViewChange('settings')} 
                                        className={`relative z-10 w-1/3 py-2 flex justify-center items-center font-bold text-sm transition-colors duration-300 ${currentView === 'settings' ? '' : 'opacity-50 hover:opacity-100'}`} 
                                        style={{ color: currentView === 'settings' ? theme.primary : theme.textDark }} 
                                        title="Settings"
                                    >
                                        <Icon name="settings" size={18} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
